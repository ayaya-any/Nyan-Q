name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and project version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(Nyan-Q VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
              throw "Unable to read the project version from CMakeLists.txt."
          }
          $version = $Matches[1]
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $tag -ne "v$version") {
              throw "Tag $tag does not match project version v$version."
          }
          $tagCommit = & git rev-parse --verify "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (& git rev-parse HEAD)) {
              throw "The checked out commit does not match release tag $tag."
          }

          $previous = ""
          $previousTags = @(& git tag --merged "$tag^" --sort=-version:refname)
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to determine the previous release tag."
          }
          $previous = @($previousTags | Where-Object { $_ -ne $tag } | Select-Object -First 1)

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PREVIOUS_TAG=$previous" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tag: $tag"
          Write-Host "Version: $version"
          Write-Host "Previous tag: $previous"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $qtRoot = "C:\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Path $qtRoot -Force | Out-Null

          $repo = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64"
          $packageName = "qt.qt6.6120.win64_msvc2022_64"
          [xml]$updates = (Invoke-WebRequest -Uri "$repo/Updates.xml" -UseBasicParsing).Content
          $package = $updates.Updates.PackageUpdate |
              Where-Object { $_.Name -eq $packageName } |
              Select-Object -First 1
          if (-not $package) {
              throw "Qt package metadata not found for $packageName."
          }

          $archive = (($package.DownloadableArchives -split ",") | Select-Object -First 1).Trim()
          $url = "$repo/$packageName/$($package.Version)$archive"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archivePath -UseBasicParsing
          $expectedHash = ((Invoke-WebRequest -Uri "$url.sha256" -UseBasicParsing).Content -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne $expectedHash) {
              throw "Qt base archive SHA256 verification failed."
          }

          $sevenZip = @(
              "C:\Program Files\7-Zip\7z.exe",
              "C:\Program Files (x86)\7-Zip\7z.exe",
              (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sevenZip) {
              throw "7-Zip was not found on the runner."
          }

          & $sevenZip x $archivePath "-o$qtRoot" -y
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract the Qt base archive."
          }
          if (-not (Test-Path (Join-Path $qtRoot "bin\windeployqt.exe"))) {
              throw "Qt base files were not installed correctly."
          }

          "QT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Qt directory: $qtRoot"

      - name: Build, test and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\package.ps1 -QtDir $env:QT_DIR -Installer

      - name: Generate checksums and release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(
              (Join-Path $env:GITHUB_WORKSPACE "dist\Nyan-Q-$env:VERSION-win64.zip"),
              (Join-Path $env:GITHUB_WORKSPACE "dist\Nyan-Q-$env:VERSION-win64-setup.exe")
          )
          foreach ($asset in $assets) {
              if (-not (Test-Path -LiteralPath $asset)) {
                  throw "Expected release asset not found: $asset"
              }
          }

          .\scripts\release-notes.ps1 `
              -Tag $env:TAG `
              -Version $env:VERSION `
              -PreviousTag $env:PREVIOUS_TAG `
              -Assets $assets `
              -ChecksumsFile "dist\SHA256SUMS.txt" `
              -OutputFile "dist\release-notes.md" `
              -Repository $env:GITHUB_REPOSITORY

          Get-Content "dist\release-notes.md"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nyan-Q-${{ env.TAG }}
          path: |
            dist/Nyan-Q-*-win64.zip
            dist/Nyan-Q-*-win64-setup.exe
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:TAG
          $assets = @(
              "dist\Nyan-Q-$env:VERSION-win64.zip",
              "dist\Nyan-Q-$env:VERSION-win64-setup.exe",
              "dist\SHA256SUMS.txt"
          )

          $exists = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              $exists = $true
          }

          if ($exists) {
              gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets." }
              gh release edit $tag --title "Nyan-Q $tag" --notes-file "dist\release-notes.md" --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Failed to update the GitHub release." }
          } else {
              gh release create $tag @assets --verify-tag --title "Nyan-Q $tag" --notes-file "dist\release-notes.md" --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Failed to create the GitHub release." }
          }
